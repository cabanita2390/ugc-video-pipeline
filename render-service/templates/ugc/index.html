<!doctype html>
<html
  lang="es"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"hook","type":"string","label":"Hook","default":"Esto cambió mi rutina"},
    {"id":"words","type":"string","label":"Words JSON","default":"[{\"text\":\"Hola\",\"start\":0.2,\"end\":0.7},{\"text\":\"mundo\",\"start\":0.7,\"end\":1.4}]"},
    {"id":"ai_model_used","type":"string","label":"AI model used","default":"unknown"},
    {"id":"accent","type":"color","label":"Accent","default":"#facc15"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap-3.14.2.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 800;
        src: url("assets/fonts/inter-latin-800-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 900;
        src: url("assets/fonts/inter-latin-900-normal.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: linear-gradient(180deg, #18181b 0%, #0a0a0a 100%);
      }
      #hook {
        position: absolute;
        top: 260px;
        left: 80px;
        right: 80px;
        color: #f4f4f5;
        font-size: 84px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.03em;
        text-align: center;
      }
      .word {
        position: absolute;
        left: 80px;
        right: 80px;
        top: 1180px;
        color: var(--accent);
        font-size: 120px;
        font-weight: 900;
        text-align: center;
        text-transform: uppercase;
        text-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <!-- data-duration is locked at compile time: the render service rewrites it per job with the audio length. -->
    <div id="root" data-composition-id="main" data-duration="6" data-width="1080" data-height="1920">
      <h1 id="hook" class="clip" data-start="0" data-duration="2.5" data-track-index="0" data-var-text="hook">
        Esto cambió mi rutina
      </h1>
      <div id="captions"></div>
      <audio id="voice" src="assets/voice.mp3" data-start="0" data-track-index="2" data-volume="1"></audio>
    </div>
    <script>
      const { words, ai_model_used } = window.__hyperframes.getVariables();
      document.getElementById("root").dataset.aiModelUsed = ai_model_used;

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#hook", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);

      const captions = document.getElementById("captions");
      JSON.parse(words).forEach((w, i) => {
        const el = document.createElement("div");
        el.id = "w" + i;
        el.className = "word clip";
        el.dataset.start = String(w.start);
        el.dataset.duration = String(w.end - w.start);
        el.dataset.trackIndex = "1";
        el.textContent = w.text;
        captions.appendChild(el);
        tl.fromTo(el, { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.12, ease: "back.out(2)" }, w.start);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
